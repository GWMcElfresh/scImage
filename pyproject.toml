[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scimage"
version = "0.1.0"
description = "Single-cell expression images via Gromov-Wasserstein optimal transport"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["single-cell", "optimal transport", "gene expression", "image"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "POT>=0.8",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
anndata = ["anndata>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scimage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
